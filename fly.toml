# fly.toml app configuration file generated for simple-draft.
#
# See https://fly.io/docs/reference/configuration/ for detailed information.

app = "simple-draft"
primary_region = "fra"

[build]

[env]
  PORT = "8080"
  DATA_DIR = "/data"
  APP_URL = "https://simple-draft.fly.dev"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

[[mounts]]
  source = "simple_draft_data"
  destination = "/data"

[deploy]
  strategy = "immediate"
